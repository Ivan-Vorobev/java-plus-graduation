spring:
  output:
    ansi:
      enabled: always
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6432/ewm
    username: ewm-main
    password: ewm-main

grpc:
  server:
    port: 0

analyzer:
  kafka:
    consumer:
      user-action:
        properties:
          client.id: "stats.analyzer-user-action"
          group.id: "stats.analyzer-user-action.group"
          auto.offset.reset: latest
          bootstrap.servers: localhost:9092
          key.deserializer: org.apache.kafka.common.serialization.LongDeserializer
          value.deserializer: ru.practicum.ewm.stats.avro.deserializer.UserActionAvroDeserializer
          enable.auto.commit: false
      event-similarity:
        properties:
          client.id: "stats.analyzer-event-similarity"
          group.id: "stats.analyzer-event-similarity.group"
          auto.offset.reset: latest
          bootstrap.servers: localhost:9092
          key.deserializer: org.apache.kafka.common.serialization.LongDeserializer
          value.deserializer: ru.practicum.ewm.stats.avro.deserializer.EventSimilarityAvroDeserializer
          enable.auto.commit: false
    topics:
      user-actions: stats.user-actions.v1
      events-similarity: stats.events-similarity.v1