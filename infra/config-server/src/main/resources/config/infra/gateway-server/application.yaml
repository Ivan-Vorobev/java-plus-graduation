server:
  port: 8080
  servlet:
    encoding:
      force: true
      charset: UTF-8

spring:
  output:
    ansi:
      enabled: always
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: stats-server
          uri: lb://stats-server
          predicates:
            - Path=/hit/**, /stats/**

        - id: category-service
          uri: lb://category-service
          predicates:
            - Path=/categories/**, /admin/categories/**

        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/admin/comments/*, /users/*/events/*/comments, /users/*/comments, /events/*/comments, /events/*/comments/*

        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/internal/requests/**, /users/*/requests/**, /users/*/events/*/requests

        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/admin/compilations/**, /compilations/**, /admin/events/**, /internal/events/**, /users/*/events/**, /events/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users, /admin/users/*, /internal/users/*

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.http.server.reactive: DEBUG
    reactor.netty: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: info
  info:
    env:
      enabled: true